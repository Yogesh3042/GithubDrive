<!DOCTYPE html>
<html>
<head>
<title>GitHub Drive by Yogesh</title>
<style>
body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: #f4f7fa;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 600px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #4a90e2;
    margin-bottom: 20px;
}

h2 {
    text-align: center;
    color: #333;
}

form input[type="text"],
form input[type="file"] {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    margin-bottom: 20px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

#drop {
    border: 2px dashed #bbb;
    padding: 30px;
    text-align: center;
    border-radius: 8px;
    color: #888;
    cursor: pointer;
    transition: border 0.3s, color 0.3s;
}

#drop:hover {
    border-color: #666;
    color: #444;
}

button {
    width: 100%;
    padding: 12px;
    background: #4a90e2;
    color: white;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.3s;
}

button:hover {
    background: #357ab8;
}

a.view-repos {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #4a90e2;
    text-decoration: none;
}

a.view-repos:hover {
    text-decoration: underline;
}
</style>
</head>
<body>

<div class="container">

<h1>GitHub Drive by Yogesh</h1>
<h2>Upload Files</h2>

<form action="/upload" method="post" enctype="multipart/form-data">

<label>Repository Name:</label>
<input name="repo" placeholder="Enter folder name..." required>

<div id="drop">
Drag & Drop Files Here<br>or<br>
<input type="file" name="files" multiple>
</div>

<button type="submit">Upload Files</button>

</form>

<a class="view-repos" href="/repos">View Repositories ➤</a>

</div>
</body>
</html>
